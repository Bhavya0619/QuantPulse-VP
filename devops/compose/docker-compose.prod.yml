services:
  # ----------------------------------------------------------------------------
  # Database Layer (MongoDB)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: quantpulse-mongodb
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=quantpulse
    volumes:
      - mongodb_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - quantpulse-internal

  # ----------------------------------------------------------------------------
  # Caching Layer (Redis)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: quantpulse-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - quantpulse-internal

  # ----------------------------------------------------------------------------
  # C++20 Quantitative Analytics Engine (HTTP Microservice)
  # ----------------------------------------------------------------------------
  cpp-engine:
    build:
      context: ../..
      dockerfile: devops/docker/cpp-engine/Dockerfile
    image: quantpulse-cpp-engine:latest
    container_name: quantpulse-cpp-engine
    restart: always
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - quantpulse-internal

  # ----------------------------------------------------------------------------
  # Backend API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../..
      dockerfile: devops/docker/backend/Dockerfile
    image: quantpulse-backend:latest
    container_name: quantpulse-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=quantpulse
      - REDIS_URL=redis://redis:6379
      - CPP_ENGINE_URL=http://cpp-engine:9000
      - QUANTPULSE_ENGINE_PATH=/usr/local/bin/quantpulse_cli
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-simulated}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - POLYGON_API_KEY=${POLYGON_API_KEY:-}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - LOG_FORMAT=json
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      cpp-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
    networks:
      - quantpulse-internal

  # ----------------------------------------------------------------------------
  # Frontend SPA & Nginx Reverse Proxy (Public Entrypoint)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../..
      dockerfile: devops/docker/frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=""
        - VITE_BACKEND_URL=""
        - VITE_DEFAULT_SYMBOL=RELIANCE
    image: quantpulse-frontend:latest
    container_name: quantpulse-frontend
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - quantpulse-internal

  # ----------------------------------------------------------------------------
  # Observability - Prometheus Metrics Collector
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: quantpulse-prometheus
    restart: always
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - quantpulse-internal

  # ----------------------------------------------------------------------------
  # Observability - Grafana Analytics Dashboards
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: quantpulse-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-quantpulse}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - quantpulse-internal

volumes:
  mongodb_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  quantpulse-internal:
    driver: bridge
